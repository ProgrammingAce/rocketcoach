<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RL Playboard</title>
<meta name="description" content="Top-down Rocket League tactics board with ball prediction, wall and car bounces, and car control-area heatmaps.">
<style>
:root{
  --bg:#0d1015; --panel:#141921; --panel2:#1b2230; --line:#283141; --text:#e6eaf0; --muted:#8b96a8;
  --accent:#ffd84a; --blue:#3d8bff; --orange:#ff8a1f; --danger:#ff5d5d;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:#3d4a60}
button.on{background:#2a3550;border-color:#4b6aa8}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=number]{width:84px}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.brand{font-weight:700;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
.brand b{color:var(--accent)}
#frames{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#frames button{padding:3px 8px}
#frames .x{margin-left:6px;color:var(--muted)}
.spacer{flex:1}
#transport{display:flex;gap:6px;align-items:center}
#tlabel{font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
#trange{width:160px}
.group{display:flex;gap:4px;align-items:center}
main{display:grid;grid-template-columns:50px 1fr 270px;min-height:0}
#tools{display:flex;flex-direction:column;gap:4px;padding:6px;border-right:1px solid var(--line);background:var(--panel);align-items:center}
#tools button{width:36px;height:36px;padding:0;display:grid;place-items:center}
#tools svg{width:20px;height:20px}
#tools .sep{height:1px;width:28px;background:var(--line);margin:4px 0}
.swatch{width:20px!important;height:20px!important;border-radius:50%!important;border:2px solid transparent!important}
.swatch.on{border-color:#fff!important}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:var(--bg)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#main{cursor:default}
#panel{overflow:auto;border-left:1px solid var(--line);padding:10px 12px;background:var(--panel)}
#panel h3{margin:4px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
#panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
#panel .row label{color:var(--muted)}
#panel .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#panel .sec{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
#panel .tip{color:var(--muted);font-size:12px}
#panel kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
#events{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
#events li{display:flex;gap:6px;padding:2px 0;font-size:12px}
#events .t{color:var(--muted);width:44px;flex:none}
details summary{cursor:pointer;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.note{font-size:11px;color:var(--muted);margin:6px 0}
footer{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
footer label{display:flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
footer output{color:var(--text);font-variant-numeric:tabular-nums;min-width:36px}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#222b3a;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
#textInput{position:absolute;z-index:5;display:none;background:#0d1015;border:1px solid var(--accent);border-radius:4px;padding:2px 6px;font-weight:600;min-width:120px}
#selftest{position:fixed;left:8px;bottom:8px;background:#0d1015ee;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,monospace;z-index:20;max-width:90vw}
#selftest .ok{color:#6ee787}#selftest .bad{color:var(--danger)}
@media (max-width:760px){
  body{height:auto;min-height:100dvh;overflow:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  #tools{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 16px}
  #tools .sep{width:1px;height:28px;margin:0 4px}
  #panel{border-left:0;border-top:1px solid var(--line);padding:10px 16px}
  header,footer{padding:6px 16px}
  #trange{width:110px}
}
</style>
</head>
<body>
<header>
  <div class="brand">RL <b>Playboard</b></div>
  <div id="frames" aria-label="Frames"></div>
  <div class="spacer"></div>
  <div id="transport">
    <button id="play" title="Play / pause (Space)" aria-label="Play">▶</button>
    <span id="tlabel">0.00s</span>
    <input id="trange" type="range" min="0" max="3.5" step="0.01" value="0" aria-label="Timeline">
    <select id="rate" aria-label="Playback speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
    <label title="Continue into the next frame when playback ends" style="display:flex;gap:4px;align-items:center;color:var(--muted)"><input id="chain" type="checkbox"> chain</label>
  </div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl/⌘+Z)">↶</button>
    <button id="redo" title="Redo (Ctrl/⌘+Shift+Z)">↷</button>
    <button id="fit" title="Fit field (0)">Fit</button>
    <button id="share" title="Copy a link to this board">Share</button>
    <button id="png" title="Export PNG">PNG</button>
    <button id="gif" title="Export the play as an animated GIF (plays like ▶, at the chosen speed; chains frames if 'chain' is on)">GIF</button>
    <button id="json" title="Export JSON">JSON</button>
    <button id="import" title="Import JSON (or drop a file on the field)">Import</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <nav id="tools" aria-label="Tools"></nav>
  <div id="stage">
    <canvas id="field"></canvas>
    <canvas id="heat"></canvas>
    <canvas id="main"></canvas>
    <input id="textInput" type="text" maxlength="120" aria-label="Label text">
  </div>
  <aside id="panel">
    <div id="sel"></div>
    <div class="sec">
      <h3>Ball path</h3>
      <ul id="events"></ul>
    </div>
    <div class="sec">
      <details id="physics">
        <summary>Physics</summary>
        <p class="note">2D ground-plane model: wall contacts are treated as bounces (no wall climbing, no height).</p>
        <div id="physFields"></div>
        <div class="btns"><button id="physReset">Reset defaults</button></div>
      </details>
    </div>
  </aside>
</main>
<footer>
  <label>Predict <input id="horizon" type="range" min="0.5" max="8" step="0.5"><output id="horizonOut"></output></label>
  <label><input id="wallBounce" type="checkbox"> wall bounces</label>
  <label><input id="carBounce" type="checkbox"> car bounces</label>
  <label title="How far ahead the control areas look">Control <input id="ctrlH" type="range" min="0.3" max="1.5" step="0.05"><output id="ctrlHOut"></output></label>
  <label><input id="showBeans" type="checkbox"> control areas</label>
  <label title="Draw cars and the ball larger than life. Display only: collisions and paths always use true size.">Icons <input id="iconScale" type="range" min="1" max="3" step="0.25"><output id="iconScaleOut"></output></label>
  <label><input id="showPads" type="checkbox"> boost pads</label>
  <label>Setup <select id="preset">
    <option value="">—</option><option value="k1">Kickoff 1v1</option><option value="k2">Kickoff 2v2</option><option value="k3">Kickoff 3v3</option><option value="demo">Demo play</option><option value="clear">Clear frame</option>
  </select></label>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
'use strict';
/* =====================================================================
   CONST — arena geometry and physics (Unreal units, uu)
   World +y points at the orange goal (drawn right), +x is drawn up.
   ===================================================================== */
const A = { X:4096, Y:5120, C:8064, GW:893, GD:6000, R:92.75 };
const CAR = { L:118.0, W:84.2, OFF:13.9 };           // Octane hitbox
const TICK = 1/120, DOT_DT = 0.05, ARROW_T = 0.5;     // velocity arrows show 0.5 s of travel
const MAX_CAR = 2300, THROTTLE_MAX = 1410, BOOST_ACC = 991.67, MAX_BALL = 6000;
const TH_MAX = 110 * Math.PI / 180;                   // forward reach only: cap the turn
const PHYS_DEFAULT = { drag:0.0305, eWall:0.6, muWall:0.285, eCar:0.0, carMass:180, ballMass:30, psyFlat:0.35, cooldown:1/60, minSpeed:20 };
const PHYS_META = {
  drag:['Ball drag /s',0.001], eWall:['Wall restitution',0.05], muWall:['Wall friction',0.01], eCar:['Car restitution',0.05],
  carMass:['Car mass',1], ballMass:['Ball mass',1], psyFlat:['Hit flatten',0.05], cooldown:['Hit cooldown s',0.001], minSpeed:['Stop speed',1],
};
const PSY_SCALE = [[0,.65],[500,.65],[2300,.55],[4600,.30]];
const TURN_R = [[0,145],[500,251],[1000,425],[1500,727],[1750,909],[2300,1136]];
const WALL = [[893,-5120],[2944,-5120],[4096,-3968],[4096,3968],[2944,5120],[893,5120],[893,6000],[-893,6000],[-893,5120],
  [-2944,5120],[-4096,3968],[-4096,-3968],[-2944,-5120],[-893,-5120],[-893,-6000],[893,-6000]];
const SEGS = WALL.map((p,i)=>[p[0],p[1],WALL[(i+1)%WALL.length][0],WALL[(i+1)%WALL.length][1]]);
const sym = (x,y)=>{ const s=new Set(), o=[]; for (const a of [1,-1]) for (const b of [1,-1]) { const k=(a*x)+','+(b*y); if(!s.has(k)){s.add(k);o.push([a*x,b*y]);} } return o; };
const BIG_PADS = [[3072,4096],[3584,0]].flatMap(p=>sym(...p));
const SMALL_PADS = [[0,4240],[1792,4184],[940,3308],[0,2816],[3584,2484],[1788,2300],[2048,1036],[0,1024],[1024,0]].flatMap(p=>sym(...p));
const COL = { blue:'#3d8bff', orange:'#ff8a1f', blueTint:'#9cc4ff', orangeTint:'#ffc08a', ball:'#ffffff', accent:'#ffd84a' };
const MARK_COLORS = ['#ffffff','#ffd84a','#ff5d5d','#5ee0ff'];

/* =====================================================================
   geom
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function interp(tab,x){
  if (x<=tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x<=tab[i][0]) { const [x0,y0]=tab[i-1],[x1,y1]=tab[i]; return y0+(y1-y0)*(x-x0)/(x1-x0); }
  return tab[tab.length-1][1];
}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
  const t=L?clamp(((px-ax)*dx+(py-ay)*dy)/L,0,1):0;
  return [ax+dx*t, ay+dy*t];
}
function insideArena(x,y){
  let inside=false;
  for (let i=0,j=WALL.length-1;i<WALL.length;j=i++){
    const [xi,yi]=WALL[i],[xj,yj]=WALL[j];
    if ((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
function rayToWalls(x,y,dx,dy){
  let best=Infinity;
  for (const [ax,ay,bx,by] of SEGS){
    const ex=bx-ax, ey=by-ay, den=dx*ey-dy*ex;
    if (Math.abs(den)<1e-9) continue;
    const t=((ax-x)*ey-(ay-y)*ex)/den, u=((ax-x)*dy-(ay-y)*dx)/den;
    if (t>0 && u>=0 && u<=1 && t<best) best=t;
  }
  return best;
}
/** Keep a circle of radius r inside the arena. Returns null if the center is outside. */
function constrain(x,y,r){
  if (!insideArena(x,y)) return null;
  for (let it=0;it<4;it++) for (const [ax,ay,bx,by] of SEGS){
    const [cx,cy]=closestOnSeg(x,y,ax,ay,bx,by), d=Math.hypot(x-cx,y-cy);
    if (d<r && d>1e-6){ x=cx+(x-cx)/d*r; y=cy+(y-cy)/d*r; }
  }
  return [x,y];
}
function distToSeg(px,py,ax,ay,bx,by){ const [cx,cy]=closestOnSeg(px,py,ax,ay,bx,by); return Math.hypot(px-cx,py-cy); }
function chaikin(pts,it){
  for (;it>0;it--){
    const o=[pts[0]];
    for (let i=0;i<pts.length-1;i++){ const [ax,ay]=pts[i],[bx,by]=pts[i+1]; o.push([.75*ax+.25*bx,.75*ay+.25*by],[.25*ax+.75*bx,.25*ay+.75*by]); }
    o.push(pts[pts.length-1]); pts=o;
  }
  return pts;
}
function resample(pts,step){
  const out=[pts[0].slice()]; let carry=0;
  for (let i=1;i<pts.length;i++){
    let [ax,ay]=pts[i-1]; const [bx,by]=pts[i]; let seg=Math.hypot(bx-ax,by-ay);
    while (carry+seg>=step){ const k=(step-carry)/seg; ax+= (bx-ax)*k; ay+=(by-ay)*k; out.push([ax,ay]); seg=Math.hypot(bx-ax,by-ay); carry=0; }
    carry+=seg;
  }
  const last=pts[pts.length-1], tail=out[out.length-1];
  if (Math.hypot(last[0]-tail[0],last[1]-tail[1])>1) out.push(last.slice());
  return out;
}

/* =====================================================================
   sim — car poses over time and ball prediction (pure)
   ===================================================================== */
const pathCache=new WeakMap();
function pathCum(path){
  let c=pathCache.get(path);
  if (!c){ c=[0]; for (let i=1;i<path.length;i++) c.push(c[i-1]+Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1])); pathCache.set(path,c); }
  return c;
}
/** Car pose at time t. fwd = (cos hdg, sin hdg) in world. */
function carPose(car,t){
  const c=Math.cos(car.hdg), s=Math.sin(car.hdg);
  if (car.motion==='path' && car.path && car.path.length>1){
    const P=car.path, cum=pathCum(P), total=cum[cum.length-1], d=car.speed*t;
    const moving=d<total, dd=Math.min(d,total);
    let i=1; while (i<cum.length-1 && cum[i]<dd) i++;
    const [ax,ay]=P[i-1],[bx,by]=P[i], seg=cum[i]-cum[i-1]||1, k=clamp((dd-cum[i-1])/seg,0,1);
    const h=Math.atan2(by-ay,bx-ax);
    return { x:ax+(bx-ax)*k, y:ay+(by-ay)*k, hdg:h, vx:moving?Math.cos(h)*car.speed:0, vy:moving?Math.sin(h)*car.speed:0 };
  }
  if (car.motion==='linear' && car.speed>0){
    const maxD=Math.max(0, rayToWalls(car.x,car.y,c,s)-70), d=car.speed*t, moving=d<maxD, dd=Math.min(d,maxD);
    return { x:car.x+c*dd, y:car.y+s*dd, hdg:car.hdg, vx:moving?c*car.speed:0, vy:moving?s*car.speed:0 };
  }
  return { x:car.x, y:car.y, hdg:car.hdg, vx:c*car.speed, vy:s*car.speed };  // 'still': holds position, speed feeds the hit
}
/** Circle vs car hitbox. Returns contact normal (car → ball) and closest point, or null. */
function carContact(bx,by,p){
  const c=Math.cos(p.hdg), s=Math.sin(p.hdg), dx=bx-p.x, dy=by-p.y;
  const u=dx*c+dy*s-CAR.OFF, w=-dx*s+dy*c, hu=CAR.L/2, hw=CAR.W/2;
  const cu=clamp(u,-hu,hu), cw=clamp(w,-hw,hw);
  let nu=u-cu, nw=w-cw, d=Math.hypot(nu,nw);
  if (d>=A.R) return null;
  if (d<1e-6){ // center inside the box: push out along the axis of least penetration
    if (hu-Math.abs(u) < hw-Math.abs(w)) { nu=Math.sign(u)||1; nw=0; } else { nu=0; nw=Math.sign(w)||1; }
    d=0;
  } else { nu/=d; nw/=d; }
  const nx=nu*c-nw*s, ny=nu*s+nw*c;
  const px=p.x+(cu+CAR.OFF)*c-cw*s, py=p.y+(cu+CAR.OFF)*s+cw*c;
  return { nx, ny, px, py };
}
/**
 * Ball prediction. samples: [t,x,y,speed,touch] per tick (touch 0 none, 1 blue, 2 orange).
 * events: wall | car | goal | stop.
 */
function predict(fr,settings){
  const P=settings.phys, R=A.R, N=Math.round(settings.horizon/TICK);
  const samples=new Float32Array((N+1)*5); let n=0;
  let x=fr.ball.x, y=fr.ball.y, vx=fr.ball.vx, vy=fr.ball.vy, touch=0, end='horizon', wasMoving=Math.hypot(vx,vy)>=P.minSpeed;
  const events=[], lastHit={};
  const push=(t)=>{ samples[n++]=t; samples[n++]=x; samples[n++]=y; samples[n++]=Math.hypot(vx,vy); samples[n++]=touch; };
  push(0);
  const kCar=P.carMass/(P.carMass+P.ballMass);
  for (let i=1;i<=N;i++){
    const t=i*TICK;
    const kd=1-P.drag*TICK; vx*=kd; vy*=kd;
    let sp=Math.hypot(vx,vy); if (sp>MAX_BALL){ vx*=MAX_BALL/sp; vy*=MAX_BALL/sp; }
    x+=vx*TICK; y+=vy*TICK;
    if (settings.wallBounce){
      for (const [ax,ay,bx,by] of SEGS){
        const [cx,cy]=closestOnSeg(x,y,ax,ay,bx,by), dx=x-cx, dy=y-cy, d2=dx*dx+dy*dy;
        if (d2>=R*R || d2<1e-12) continue;
        const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, vn=vx*nx+vy*ny;
        if (vn<0){
          const sIn=Math.hypot(vx,vy);
          let tx=vx-vn*nx, ty=vy-vn*ny; const vt=Math.hypot(tx,ty);
          const kt=vt>1e-9?Math.max(0,1-P.muWall*(1+P.eWall)*Math.abs(vn)/vt):0;
          tx*=kt; ty*=kt;
          vx=tx-P.eWall*vn*nx; vy=ty-P.eWall*vn*ny;
          events.push({ t, x:cx, y:cy, kind:'wall', speedIn:sIn, speedOut:Math.hypot(vx,vy) });
        }
        x=cx+nx*R; y=cy+ny*R;
      }
    } else if (!insideArena(x,y) && !(Math.abs(x)<A.GW && Math.abs(y)<A.GD)){
      push(t); events.push({ t, x, y, kind:'out', speedIn:Math.hypot(vx,vy) }); end='out'; break;
    }
    if (settings.carBounce){
      for (const car of fr.cars){
        if (lastHit[car.id]!==undefined && t-lastHit[car.id]<P.cooldown) continue;
        const p=carPose(car,t), hit=carContact(x,y,p);
        if (!hit) continue;
        const rvx=vx-p.vx, rvy=vy-p.vy, vn=rvx*hit.nx+rvy*hit.ny;
        x=hit.px+hit.nx*R; y=hit.py+hit.ny*R;
        if (vn>=0) continue;
        const sIn=Math.hypot(vx,vy), rs=Math.min(Math.hypot(rvx,rvy),4600);
        // physical part: car treated as unstoppable, ball gets the mass-weighted normal impulse
        const j=-(1+P.eCar)*kCar*vn; vx+=j*hit.nx; vy+=j*hit.ny;
        // Psyonix extra impulse, flattened toward the car's sides
        const fx=Math.cos(p.hdg), fy=Math.sin(p.hdg);
        let dx=x-p.x, dy=y-p.y; const df=dx*fx+dy*fy; dx-=P.psyFlat*df*fx; dy-=P.psyFlat*df*fy;
        const dl=Math.hypot(dx,dy)||1, sc=interp(PSY_SCALE,rs)*rs;
        vx+=dx/dl*sc; vy+=dy/dl*sc;
        sp=Math.hypot(vx,vy); if (sp>MAX_BALL){ vx*=MAX_BALL/sp; vy*=MAX_BALL/sp; }
        lastHit[car.id]=t; touch=car.team==='blue'?1:2; wasMoving=true;
        events.push({ t, x:hit.px, y:hit.py, kind:'car', carId:car.id, team:car.team, name:car.name, speedIn:sIn, speedOut:Math.hypot(vx,vy) });
      }
    }
    if (Math.abs(y)>A.Y+R && Math.abs(x)<A.GW){
      push(t); events.push({ t, x, y, kind:'goal', side:y>0?'orange':'blue', speedIn:Math.hypot(vx,vy) }); end='goal'; break;
    }
    const s=Math.hypot(vx,vy);
    if (wasMoving && s<P.minSpeed){ wasMoving=false; events.push({ t, x, y, kind:'stop' }); }
    push(t);
  }
  return { samples:samples.subarray(0,n), events, end, duration:samples[n-5] };
}
function sampleAt(traj,t){
  const S=traj.samples, cnt=S.length/5, i=clamp(Math.floor(t/TICK),0,cnt-1), j=Math.min(i+1,cnt-1), f=clamp(t/TICK-i,0,1);
  return { x:S[i*5+1]+(S[j*5+1]-S[i*5+1])*f, y:S[i*5+2]+(S[j*5+2]-S[i*5+2])*f, touch:S[i*5+4] };
}

/* =====================================================================
   reach — area of control (time-to-reach with a Dubins-style CS path)
   ===================================================================== */
function throttleAcc(v){ return v<1400 ? 1600-1440*v/1400 : v<THROTTLE_MAX ? 160*(THROTTLE_MAX-v)/10 : 0; }

  orange:'<circle cx="12" cy="12" r="9" fill="#ff8a1f33" stroke="#ff8a1f" stroke-width="2"/><path d="M17 12l-8 4.5 2-4.5-2-4.5z" fill="#ff8a1f"/>',
  ball:'<circle cx="12" cy="12" r="8" fill="#fff"/><circle cx="12" cy="12" r="8" fill="none" stroke="#000" stroke-width="1"/>',

function eraseAt(px,py){

cvM.addEventListener('pointerdown',e=>{

    return;
  }
  if (e.button===1 || e.button===2){ ui.drag={ type:'pan', sx:px, sy:py, ox:view.ox, oy:view.oy }; return; }
  const [wx,wy]=s2w(px,py), fr=frame(), tool=ui.tool;
  if (tool==='select'){
    const h=hitTest(px,py);

    if (h.kind!=='mark') resetTime();
    if (h.kind==='ballTip'||h.kind==='ball') select({ kind:'ball' });
    else select({ kind:h.kind==='carTip'?'car':h.kind, id:h.id });
    if (h.kind==='car'){ const c=getCar(h.id); ui.drag={ type:'car', id:h.id, wx, wy, x0:c.x, y0:c.y, path0:c.path?c.path.map(p=>p.slice()):null }; }
    else if (h.kind==='ball') ui.drag={ type:'ball', wx, wy, x0:fr.ball.x, y0:fr.ball.y };
    else if (h.kind==='mark'){ const m=fr.marks.find(m=>m.id===h.id); ui.drag={ type:'mark', id:h.id, wx, wy, pts0:m.pts.map(p=>p.slice()) }; }

    return;
  }
  resetTime();
  if (tool==='blue'||tool==='orange'){
    const p=constrain(wx,wy,60); if (!p) return;
    const n=fr.cars.filter(c=>c.team===tool).length+1;
    const c=mkCar(tool,p[0],p[1],tool==='blue'?Math.PI/2:-Math.PI/2,{ name:(tool==='blue'?'B':'O')+n });

  }
  if (tool==='path'){
    const h=hitTest(px,py), id=h&&(h.kind==='car'||h.kind==='carTip')?h.id:ui.sel&&ui.sel.kind==='car'?ui.sel.id:null;
    if (!id){ toast('Start the path on a car'); return; }
    const c=getCar(id); select({ kind:'car', id });
    ui.drag={ type:'newPath', carId:id, pts:[[c.x,c.y]] }; return;
  }
  if (tool==='arrow') { ui.drag={ type:'newArrow', pts:[[wx,wy],[wx,wy]] }; return; }
  if (tool==='pen') { ui.drag={ type:'newPen', pts:[[wx,wy]] }; return; }

});
cvM.addEventListener('pointermove',e=>{
  const [px,py]=localPt(e); ui.cursor=[px,py];
  if (ui.pointers.has(e.pointerId)) ui.pointers.set(e.pointerId,[px,py]);
  const d=ui.drag;
  if (!d){
    const ev=ui.tool==='select'?hitEvent(px,py):null, prev=ui.hover&&ui.hover.e;
    ui.hover=ev?{ kind:'event', e:ev }:null;
    if (ui.tool==='select') cvM.style.cursor=ev?'help':hitTest(px,py)?'grab':'default';
    if (prev!==ev) requestRender();
    return;
  }
  const [wx,wy]=s2w(px,py), fr=frame(), shift=e.shiftKey;
  switch (d.type){
    case 'pinch':{
      if (ui.pointers.size<2) return;
      const [a,b]=[...ui.pointers.values()], dist=Math.hypot(a[0]-b[0],a[1]-b[1]);
      view.s=clamp(d.s0*dist/d.d0, view.fit*0.6, view.fit*14);
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; view.ox=mx-d.m0[1]*view.s; view.oy=my+d.m0[0]*view.s;
      ui.fieldDirty=true; break;
    }
    case 'pan': view.ox=d.ox+px-d.sx; view.oy=d.oy+py-d.sy; d.moved=true; ui.fieldDirty=true; break;
    case 'car':{
      const c=getCar(d.id), p=constrain(d.x0+wx-d.wx, d.y0+wy-d.wy, 60); if (!p) break;
      c.x=p[0]; c.y=p[1];
      if (d.path0){ const dx=c.x-d.x0, dy=c.y-d.y0; c.path=d.path0.map(([x,y])=>[x+dx,y+dy]); }
      d.changed=true; break;
    }
    case 'ball':{ const p=constrain(d.x0+wx-d.wx, d.y0+wy-d.wy, A.R); if (p){ fr.ball.x=p[0]; fr.ball.y=p[1]; d.changed=true; } break; }
    case 'carTip':{
      const c=getCar(d.id), [sx,sy]=w2s(view,c.x,c.y), dx=px-sx, dy=py-sy, dist=Math.hypot(dx,dy);
      let deg=90-Math.atan2(dx,-dy)*180/Math.PI; if (shift) deg=Math.round(deg/15)*15;
      c.hdg=(90-deg)*Math.PI/180;
      c.speed=Math.round(clamp((dist-tokR(view)-12)/(ARROW_T*view.s),0,MAX_CAR)/10)*10;
      if (c.motion==='path'){ c.motion='linear'; c.path=null; }
      d.changed=true; break;
    }
    case 'ballTip':{
      const b=fr.ball, [sx,sy]=w2s(view,b.x,b.y), dx=px-sx, dy=py-sy, dist=Math.hypot(dx,dy);
      let a=Math.atan2(-dy,dx); if (shift) a=Math.round(a/(Math.PI/12))*(Math.PI/12);
      const sp=Math.round(clamp((dist-ballRpx(view)-12)/(ARROW_T*view.s),0,MAX_BALL)/10)*10;
      // screen dir (cos a, -sin a) → world (x=sin a, y=cos a)
      b.vx=Math.sin(a)*sp; b.vy=Math.cos(a)*sp; d.changed=true; break;
    }
    case 'mark':{ const m=fr.marks.find(m=>m.id===d.id); if (m){ m.pts=d.pts0.map(([x,y])=>[x+wx-d.wx,y+wy-d.wy]); d.changed=true; } break; }
    case 'newArrow': d.pts[1]=[wx,wy]; break;
    case 'newPen':{ const l=d.pts[d.pts.length-1]; if (Math.hypot(wx-l[0],wy-l[1])>25) d.pts.push([wx,wy]); break; }
    case 'newPath':{ const l=d.pts[d.pts.length-1]; if (Math.hypot(wx-l[0],wy-l[1])>40 && insideArena(wx,wy)) d.pts.push([wx,wy]); break; }
    case 'erase': if (eraseAt(px,py)) d.changed=true; break;
  }
  requestRender();
});
function endPointer(e){
  ui.pointers.delete(e.pointerId);
  const d=ui.drag; if (!d) return;
  if (d.type==='pinch'){ if (ui.pointers.size===0) ui.drag=null; return; }
  ui.drag=null;
  const fr=frame();
  if (d.type==='newArrow'){
    const [a,b]=d.pts; if (Math.hypot(a[0]-b[0],a[1]-b[1])*view.s>10){ const m={ id:uid('m'), kind:'arrow', pts:d.pts, text:'', color:ui.color }; fr.marks.push(m); commit(); }
  } else if (d.type==='newPen'){
    if (d.pts.length>1){ fr.marks.push({ id:uid('m'), kind:'pen', pts:chaikin(d.pts,2), text:'', color:ui.color }); commit(); }
  } else if (d.type==='newPath'){
    const c=getCar(d.carId);
    if (c && d.pts.length>2){
      c.path=resample(chaikin(d.pts,3),40).map(([x,y])=>[Math.round(x),Math.round(y)]);
      c.hdg=Math.atan2(c.path[1][1]-c.path[0][1],c.path[1][0]-c.path[0][0]);
      c.motion='path'; if (c.speed<100) c.speed=1400;
      commit(); buildPanel();
    }
  } else if (d.changed) { commit(); }
  requestRender();
}

window.addEventListener('keydown',e=>{
  if (e.target.closest&&e.target.closest('input,textarea,select')) return;
  const k=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
  if (mod && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if (mod && k==='y'){ e.preventDefault(); redo(); return; }
  if (mod||e.altKey) return;
  const tool=TOOLS.find(t=>t[2]===k);
  if (tool){ setTool(tool[0]); return; }
  if (k===' '){ e.preventDefault(); togglePlay(); }
  else if (k==='arrowleft'||k==='arrowright'){ e.preventDefault(); ui.playing=false; ui.t=clamp(+(ui.t+(k==='arrowright'?DOT_DT:-DOT_DT)).toFixed(3),0,board.settings.horizon); requestRender(); }

  else if (k==='h'){ board.settings.showBeans=!board.settings.showBeans; commit(); requestRender(); }

  else if (k==='0') fitView();
  else if (k==='escape'){ select(null); }

function deleteSel(){
  const fr=frame(), s=ui.sel; if (!s) return;
  if (s.kind==='car') fr.cars=fr.cars.filter(c=>c.id!==s.id);
  else if (s.kind==='mark') fr.marks=fr.marks.filter(m=>m.id!==s.id);

const deg=h=>{ let a=90-h*180/Math.PI; a=((a+180)%360+360)%360-180; return a; };

function togglePlay(){
  if (ui.playing){ ui.playing=false; requestRender(); return; }
  if (ui.t>=board.settings.horizon-1e-3) ui.t=0;
  ui.playing=true; let last=performance.now();
  const loop=now=>{
    if (!ui.playing) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    ui.t+=dt*parseFloat($('#rate').value);
    const end=Math.min(board.settings.horizon, traj&&traj.end==='goal'?traj.duration+0.6:Infinity);
    if (ui.t>=end){
      if (board.settings.chain && board.current<board.frames.length-1){ board.current++; ui.t=0; select(null); buildFrames(); }
      else { ui.t=Math.min(ui.t,board.settings.horizon); ui.playing=false; }
    }
    render(); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop); requestRender();
}

  const V={ s:w/(2*ex), ox:w/2, oy:h/2 }, fr=frame();
  ctx.fillStyle='#0d1015'; ctx.fillRect(0,0,w,h);
  drawField(ctx,V); drawBeans(ctx,V,1,fr,ui.t); ctx.setTransform(1,0,0,1,0,0);
  drawMain(ctx,V,fr,predict(fr,board.settings),ui.t,{ interactive:false });
  c.toBlob(b=>b&&download(`rl-play-frame${board.current+1}.png`,b),'image/png');
};

/* =====================================================================
   gif — animated GIF export: median-cut palette, LZW, and frame diffs
   (unchanged pixels are transparent, so the static field is stored once)
   ===================================================================== */
function medianCut(hist,n){
  const ch=(k,c)=>(k>>(10-5*c))&31, boxes=[];
  { const b=[]; for (let k=0;k<32768;k++) if (hist[k]) b.push(k); boxes.push(b); }
  while (boxes.length<n){
    let bi=-1, best=0, bc=0;
    boxes.forEach((b,i)=>{
      if (b.length<2) return;
      let pop=0; const lo=[31,31,31], hi=[0,0,0];
      for (const k of b){ pop+=hist[k]; for (let c=0;c<3;c++){ const v=ch(k,c); if (v<lo[c]) lo[c]=v; if (v>hi[c]) hi[c]=v; } }
      let c=0; for (let j=1;j<3;j++) if (hi[j]-lo[j]>hi[c]-lo[c]) c=j;
      const sc=(hi[c]-lo[c]+1)*Math.sqrt(pop); if (sc>best){ best=sc; bi=i; bc=c; }
    });
    if (bi<0) break;
    const b=boxes[bi].sort((x,y)=>ch(x,bc)-ch(y,bc));
    let total=0; for (const k of b) total+=hist[k];
    let acc=0, m=0; for (;m<b.length-2;m++){ acc+=hist[b[m]]; if (acc>=total/2) break; }
    boxes.splice(bi,1,b.slice(0,m+1),b.slice(m+1));
  }
  return boxes.map(b=>{
    let r=0,g=0,bl=0,p=0; for (const k of b){ const w=hist[k]; r+=ch(k,0)*w; g+=ch(k,1)*w; bl+=ch(k,2)*w; p+=w; }
    return [r,g,bl].map(v=>Math.round(v/p*255/31));
  });
}
function gifLzw(px,minSize){
  const out=[], clear=1<<minSize, eoi=clear+1;
  let size=minSize+1, next=eoi+1, dict=new Map(), cur=0, bits=0;
  const emit=c=>{ cur|=c<<bits; bits+=size; while (bits>=8){ out.push(cur&255); cur>>>=8; bits-=8; } };
  emit(clear);
  let prefix=px[0];
  for (let i=1;i<px.length;i++){
    const k=px[i], key=prefix<<8|k, v=dict.get(key);
    if (v!==undefined){ prefix=v; continue; }
    emit(prefix);
    if (next===4096){ emit(clear); dict=new Map(); size=minSize+1; next=eoi+1; }
    else { if (next>=(1<<size)) size++; dict.set(key,next++); }   // one code early: the decoder lags by one
    prefix=k;
  }
  emit(prefix); emit(eoi); if (bits>0) out.push(cur&255);
  const blocks=new Uint8Array(out.length+Math.ceil(out.length/255)+2); let o=0;
  blocks[o++]=minSize;
  for (let i=0;i<out.length;i+=255){ const n=Math.min(255,out.length-i); blocks[o++]=n; for (let j=0;j<n;j++) blocks[o++]=out[i+j]; }
  blocks[o++]=0;
  return blocks.subarray(0,o);
}
/** The timeline Play would show: from the current frame on (chained if 'chain' is on). */
function gifShots(){
  const S=board.settings, rate=parseFloat($('#rate').value)||1, dt=0.05*rate, shots=[];
  const last=S.chain?board.frames.length-1:board.current;
  for (let fi=board.current;fi<=last;fi++){
    const fr=board.frames[fi], tr=predict(fr,S), end=Math.min(S.horizon, tr.end==='goal'?tr.duration+0.6:Infinity);
    shots.push({ fr, tr, t:0, delay:60 });                         // hold the setup so viewers can read it
    for (let t=dt;t<end+dt/2;t+=dt) shots.push({ fr, tr, t:Math.min(t,end), delay:5 });
    shots[shots.length-1].delay=fi===last?150:60;
  }
  return shots;
}
async function exportGif(){
  const btn=$('#gif'); if (btn.disabled) return; btn.disabled=true;
  try {
    const ex=6000+260, ey=4096+260, w=960, h=Math.round(w*ey/ex);
    const V={ s:w/(2*ex), ox:w/2, oy:h/2 }, shots=gifShots();
    const bg=el('canvas',{width:w,height:h}), bctx=bg.getContext('2d');
    bctx.fillStyle='#0d1015'; bctx.fillRect(0,0,w,h); drawField(bctx,V);
    const c=el('canvas',{width:w,height:h}), ctx=c.getContext('2d',{ willReadFrequently:true });
    const shoot=s=>{
      ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0);
      drawBeans(ctx,V,1,s.fr,s.t); ctx.setTransform(1,0,0,1,0,0);
      drawMain(ctx,V,s.fr,s.tr,s.t,{ interactive:false });
      return ctx.getImageData(0,0,w,h).data;
    };
    const tick=async msg=>{ toast(msg); await new Promise(r=>setTimeout(r)); };
    // pass 1: palette from a sample of frames (255 colors; index 255 is "unchanged")
    const hist=new Uint32Array(32768), step=Math.max(1,Math.floor(shots.length/16));
    for (let i=0;i<shots.length;i+=step){
      const d=shoot(shots[i]);
      for (let p=0;p<d.length;p+=4) hist[(d[p]>>3)<<10|(d[p+1]>>3)<<5|d[p+2]>>3]++;
      await tick(`Building GIF palette… ${Math.round(i/shots.length*100)}%`);
    }
    const pal=medianCut(hist,255), lut=new Int16Array(32768).fill(-1);
    const nearest=k=>{
      const r=(k>>10&31)*255/31, g=(k>>5&31)*255/31, b=(k&31)*255/31; let bi=0, bd=Infinity;
      pal.forEach(([pr,pg,pb],i)=>{ const d=(pr-r)**2*0.3+(pg-g)**2*0.59+(pb-b)**2*0.11; if (d<bd){ bd=d; bi=i; } });
      return lut[k]=bi;
    };
    // header, global palette, loop forever
    const parts=[], u16=v=>[v&255,v>>8&255];
    const gct=new Uint8Array(768); pal.forEach((col,i)=>gct.set(col,i*3));
    parts.push(new Uint8Array([...'GIF89a'].map(ch=>ch.charCodeAt(0)).concat(u16(w),u16(h),[0xF7,0,0])), gct,
      new Uint8Array([0x21,0xFF,0x0B,...[...'NETSCAPE2.0'].map(ch=>ch.charCodeAt(0)),0x03,0x01,0,0,0]));
    // pass 2: encode, storing only the changed rectangle of each frame
    const prev=new Uint8Array(w*h), cur=new Uint8Array(w*h);
    for (let i=0;i<shots.length;i++){
      const d=shoot(shots[i]);
      for (let p=0,q=0;q<cur.length;p+=4,q++){ const k=(d[p]>>3)<<10|(d[p+1]>>3)<<5|d[p+2]>>3; const v=lut[k]; cur[q]=v>=0?v:nearest(k); }
      let x0=0,y0=0,x1=w-1,y1=h-1;
      if (i>0){
        x0=w; y0=h; x1=-1; y1=-1;
        for (let y=0;y<h;y++) for (let x=0,q=y*w;x<w;x++,q++) if (cur[q]!==prev[q]){ if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y; }
        if (x1<0){ x0=y0=x1=y1=0; }                                  // nothing moved: a 1-pixel no-op frame
      }
      const rw=x1-x0+1, rh=y1-y0+1, sub=new Uint8Array(rw*rh);
      for (let y=0;y<rh;y++) for (let x=0;x<rw;x++){ const q=(y0+y)*w+x0+x; sub[y*rw+x]=i>0&&cur[q]===prev[q]?255:cur[q]; }
      prev.set(cur);
      parts.push(new Uint8Array([0x21,0xF9,0x04,0x05,...u16(shots[i].delay),255,0, 0x2C,...u16(x0),...u16(y0),...u16(rw),...u16(rh),0]), gifLzw(sub,8));
      if (i%3===0) await tick(`Encoding GIF… ${Math.round(i/shots.length*100)}%`);
    }
    parts.push(new Uint8Array([0x3B]));
    const blob=new Blob(parts,{type:'image/gif'});
    download(`rl-play-frame${board.current+1}.gif`,blob);
    toast(`GIF saved · ${(blob.size/1048576).toFixed(1)} MB`);
  } catch (e){ console.error(e); toast('Could not build the GIF'); }
  finally { btn.disabled=false; }
}
$('#gif').onclick=exportGif;
$('#import').onclick=()=>$('#file').click();
async function importFile(f){
  if (!f || f.size>5e6){ toast('File too large'); return; }
  try { board=normalizeBoard(JSON.parse(await f.text())); onBoardReplaced(); commit(); toast('Imported'); } catch { toast('Not a valid board file'); }
}
$('#file').addEventListener('change',e=>{ importFile(e.target.files[0]); e.target.value=''; });
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{ e.preventDefault(); importFile(e.dataTransfer.files[0]); });
function onBoardReplaced(){ ui.fieldDirty=true; resetTime(); buildFrames(); buildPhysics(); buildPanel(); requestRender(); }

/* =====================================================================
   selftest (?selftest)
   ===================================================================== */
function selftest(){
  const S={ ...defaultSettings(), horizon:4 }, R=[];
  const ok=(name,cond,info='')=>R.push([name,!!cond,info]);
  const F=(ball,cars=[])=>({ ball, cars, marks:[] });
  let tr=predict(F({x:0,y:0,vx:2000,vy:0}),S), e=tr.events.find(e=>e.kind==='wall');
  ok('side wall: 0.6× speed, straight back', e && Math.abs(e.speedOut/e.speedIn-0.6)<0.01 && Math.abs(e.y)<1, e&&(e.speedOut/e.speedIn).toFixed(3));
  tr=predict(F({x:2000,y:2000,vx:1500,vy:1500}),S); e=tr.events.find(e=>e.kind==='wall');
  { const i=Math.round(e.t/TICK)+2, S5=tr.samples, dx=S5[i*5+1]-S5[(i-1)*5+1], dy=S5[i*5+2]-S5[(i-1)*5+2], ang=Math.atan2(dy,dx)*180/Math.PI;
    ok('chamfer head-on reflects along normal', e && Math.abs(ang+135)<2, ang.toFixed(1)+'°'); }
  tr=predict(F({x:0,y:0,vx:0,vy:3000}),S); e=tr.events.find(e=>e.kind==='goal');
  ok('shot at mouth center scores', e && e.side==='orange' && e.t>1.70 && e.t<1.85, e&&e.t.toFixed(3)+'s');
  tr=predict(F({x:893,y:0,vx:0,vy:3000}),S);
  ok('shot at the post bounces, no goal', tr.events[0]&&tr.events[0].kind==='wall' && !tr.events.some(e=>e.kind==='goal'&&e.t<2));
  const still=mkCar('blue',0,1500,-Math.PI/2,{ motion:'still' });
  tr=predict(F({x:0,y:0,vx:0,vy:1500},[still]),S); e=tr.events.find(e=>e.kind==='car');
  ok('ball into parked car bounces, slows', e && e.speedOut<e.speedIn, e&&`${Math.round(e.speedIn)}→${Math.round(e.speedOut)}`);
  const mover=mkCar('blue',0,-400,Math.PI/2,{ speed:1400 });
  tr=predict(F({x:0,y:0,vx:0,vy:0},[mover]),S); e=tr.events.find(e=>e.kind==='car');
  ok('1400 uu/s car hit → ~1700–2300 ball', e && e.speedOut>1700 && e.speedOut<2300, e&&Math.round(e.speedOut));
  const side=mkCar('orange',0,1000,0,{ motion:'still' });
  tr=predict(F({x:0,y:0,vx:0,vy:6000},[side]),S);
  ok('6000 uu/s ball does not tunnel through car', tr.events.some(e=>e.kind==='car'));
  const g=reachGrid(1400,false,0.75); let sym=true;
  for (let j=0;j<g.rows;j++) for (let i=0;i<g.cols;i++){ const a=g.time[j*g.cols+i], b=g.time[(g.rows-1-j)*g.cols+i]; if (!(a===b || Math.abs(a-b)<1e-5)) sym=false; }
  ok('bean is left/right symmetric', sym);
  const ci=Math.floor((0-g.u0)/g.cell), cj=Math.floor((g.r-g.w0)/g.cell);
  ok('turning-circle centers unreachable', !isFinite(g.time[cj*g.cols+ci]) && !isFinite(g.time[(g.rows-1-cj)*g.cols+ci]));
  const ahead=Math.floor((600-g.u0)/g.cell), mid=g.rows/2;
  ok('straight ahead is reachable and red', isFinite(g.time[mid*g.cols+ahead]) && g.theta[mid*g.cols+ahead]<0.1);
  const box=el('div',{id:'selftest'});
  box.append(el('div',{textContent:`selftest: ${R.filter(r=>r[1]).length}/${R.length} passed`}));
  for (const [n,p,i] of R) box.append(el('div',{className:p?'ok':'bad',textContent:`${p?'✓':'✗'} ${n}${i?'  ('+i+')':''}`}));
  document.body.append(box);
  console.log('[selftest]', JSON.stringify(R));
}

/* =====================================================================
   boot
   ===================================================================== */
async function boot(){
  buildTools(); syncTools();
  let loaded=null;
  if (location.hash.length>3){ try { const b=await decodeShare(location.hash); if (b) loaded=normalizeBoard(b); } catch { toast('Share link could not be read'); } }
  if (!loaded){ try { const s=localStorage.getItem('rlpb.board'); if (s) loaded=normalizeBoard(JSON.parse(s)); } catch {} }
  if (loaded) board=loaded;
  hist.stack=[serialize()]; hist.i=0;
  buildFrames(); buildPhysics(); buildPanel();
  new ResizeObserver(resize).observe(stage);
  resize();
  if (new URLSearchParams(location.search).has('selftest')) selftest();
}
boot();
